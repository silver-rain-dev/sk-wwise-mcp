name: Build and release

# Triggers:
#   - push to a tag like v0.2.0 -> build the exe, the .mcpb and the plugin zip,
#                                  publish a GitHub release with all three
#                                  assets, then commit the new marketplace.json
#                                  to main (exact tag URL + version)
#   - manual dispatch           -> build, upload the three assets as workflow
#                                  artifacts (no release, no commit)
#
# Loop safety: this workflow only triggers on `v*` tags and manual dispatch.
# The marketplace commit goes to the `main` branch, which matches neither, and
# it is pushed with the built-in GITHUB_TOKEN, which never starts new workflow
# runs. The commit message also carries [skip ci].
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # create the release and push the marketplace.json commit

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      # Tag builds: v0.2.0 -> 0.2.0, checked by the same script that writes
      # marketplace.json. It goes to build.ps1 so the .mcpb manifest, plugin.json
      # and marketplace.json all carry the tag's version. Manual runs skip this
      # and use the version in pyproject.toml.
      - name: Resolve version
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = python release/bump_marketplace.py --tag $env:TAG --print-version
          if ($LASTEXITCODE -ne 0) { throw "tag '$env:TAG' is not a version tag" }
          "version=$v" >> $env:GITHUB_OUTPUT

      # build.ps1: PyInstaller exe -> .mcpb -> plugin zip -> legacy zip.
      # Output: sk-wwise-plugin.zip, sk-wwise-mcp.mcpb, sk-wwise-mcp.zip.
      # The optional mcpb / claude validators are skipped when npx / claude are
      # not on PATH.
      - name: Build bundle
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:VERSION) { .\build.ps1 -Version $env:VERSION } else { .\build.ps1 }

      # Code signing intentionally not wired up — releases ship unsigned and
      # users see a one-time Windows SmartScreen warning ("More info → Run
      # anyway"). This is documented in release/README.md.
      #
      # If SmartScreen friction becomes a real issue, two practical paths:
      #   - SignPath.io free OSS tier (1-2 wk approval, then add their action
      #     here using a SIGNPATH_API_TOKEN secret).
      #   - Azure Trusted Signing (~$10/mo, needs verified Entra identity,
      #     uses azure/trusted-signing-action).
      # Both insert a step between this build and the release upload below.

      - name: Smoke test
        shell: pwsh
        run: |
          .\dist\sk-wwise-mcp.exe --help
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }

      # Manual / non-tag runs: keep the three assets as artifacts for inspection.
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sk-wwise-mcp-${{ github.sha }}
          path: |
            sk-wwise-plugin.zip
            sk-wwise-mcp.mcpb
            sk-wwise-mcp.zip
          if-no-files-found: error

      # Tag pushes: publish a GitHub release with the three assets attached.
      #   sk-wwise-plugin.zip  Claude plugin (the marketplace points at this URL)
      #   sk-wwise-mcp.mcpb    standalone bundle for Claude Desktop chat
      #   sk-wwise-mcp.zip     legacy zip (exe + .mcp.json + skills)
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sk-wwise-plugin.zip
            sk-wwise-mcp.mcpb
            sk-wwise-mcp.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Tag pushes, after the release exists: write marketplace.json with this
      # tag's exact asset URL, version and the sha256 of the zip that was just
      # released, then commit it to main. A tag checkout is a detached HEAD, so
      # the file is written first (with the script from the tagged commit) into
      # a temp dir, then main is checked out and the file copied over. Re-running
      # a tag produces identical bytes, so "nothing to commit" is a success.
      - name: Update marketplace.json on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python release/bump_marketplace.py --tag "$TAG" --repo "$REPO" \
            --zip sk-wwise-plugin.zip --path "$RUNNER_TEMP/marketplace.json"
          git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main origin/main
          mkdir -p .claude-plugin
          cp "$RUNNER_TEMP/marketplace.json" .claude-plugin/marketplace.json
          git add .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "marketplace.json already up to date for $TAG; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update marketplace.json for $TAG [skip ci]"
          git push origin HEAD:main
